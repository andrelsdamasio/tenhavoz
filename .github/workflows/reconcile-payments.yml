name: Conciliar pagamentos

# Chama a rotina do site a cada 5 minutos: libera pagamentos aprovados que o
# webhook perdeu e avisa o admin dos que precisam de atendimento.
# Secrets necessários no GitHub: CRON_SECRET (o mesmo valor da Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/reconcile
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.tenhavoz.com.br/api/cron/reconcile"
